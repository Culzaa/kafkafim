# yamllint config for deploy/grafana (CI job "Grafana format"). Google has no YAML
# style guide; this keeps to the common subset: 2-space indent, no trailing spaces, LF.
extends: default
rules:
  document-start: disable      # Prometheus rule files and Grafana providers have no `---`
  line-length: disable         # alert expressions and descriptions are long single lines
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1       # `{ a: b }` flow maps in the rule tests
