# Load-test stack (loadtest/README.md). Kafka and Elasticsearch as in the local demo, with fixed
# resource limits so runs on one machine compare. Not used by the build, CI or production.
name: kafkafim-loadtest
services:
  kafka:
    image: 'apache/kafka:4.1.0'   # JVM image: it carries the CLI scripts run.sh uses to create topics
    ports:
      - '19092:9092'              # not 9092: leaves the development Compose stack's port free
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: '-Xms1g -Xmx1g'
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:8.19.0'
    ports:
      - '19200:9200'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf localhost:9200/_cluster/health >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
