name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read      # default for every job; the publish job below raises what it needs
jobs:
  # Runs the tests (and so Maven plugins and dependency code) at the tag with a read-only token:
  # no write, packages or id-token permission is available to it. `release` needs it to pass.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test at the tag
        run: ./mvnw -B -ntp -Drevision="${GITHUB_REF_NAME#v}" verify
      # The Dockerfile copies target/*.jar into the image: hand the tested jar to `release`.
      - name: Application jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error
  # Publishes and signs; runs no Maven. The image is built from the jar that `verify` tested.
  release:
    needs: verify
    permissions:
      contents: write     # GitHub Release
      packages: write     # GHCR image + chart
      id-token: write     # Cosign keyless
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kafkafim"
            echo "chart_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_OUTPUT"
          mkdir -p dist
      - name: Stage alert rules and dashboards
        # First, so a missing file fails the release before anything is published. The air-gap
        # bundle step packs everything under dist/ and lists it in SHA256SUMS.
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          out="dist/kafkafim-${V}-grafana"
          mkdir -p "$out/alerts" "$out/dashboards"
          cp deploy/grafana/alerts/kafkafim-alerts.yaml "$out/alerts/"
          cp deploy/grafana/dashboards/*.json "$out/dashboards/"
          # runbook_url points at this tag's RUNBOOK, not main; the bundle carries a copy for the air gap
          sed -i "s#/blob/main/docs/RUNBOOK.md#/blob/v${V}/docs/RUNBOOK.md#" "$out/alerts/kafkafim-alerts.yaml"
          cp docs/RUNBOOK.md "$out/"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: target/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4   # pinned: the save/load round trip below depends on the signature format this version emits
      - name: Sign image
        # Legacy (.sig tag) format on purpose: cosign v3 defaults to the OCI-referrer bundle
        # format, which `cosign save` / `cosign load` do not carry into the air-gap layout.
        # `cosign verify` falls back to the legacy format automatically. cosign v3.1 refuses
        # `--new-bundle-format=false` alone ("must provide --new-bundle-format or --bundle where
        # applicable with --signing-config or --use-signing-config"); the TUF signing config only
        # serves the new format, so it is switched off and Fulcio/Rekor use their public defaults.
        # Re-check the save/load round trip before bumping cosign: --new-bundle-format is deprecated.
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --use-signing-config=false --new-bundle-format=false "${IMAGE}@${DIGEST}"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ver.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: dist/kafkafim-${{ steps.ver.outputs.version }}.sbom.spdx.json
          upload-artifact: false
      - name: Save the signed image for the air gap
        # Pulls the exact pushed digest (all platforms) together with its Cosign signature
        # into an OCI layout, so the bundle carries what was signed. BuildKit provenance
        # travels inside the image index; no Cosign attestation exists (no `cosign attest`).
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          cosign save --dir "dist/kafkafim-${V}-image" "${IMAGE}@${DIGEST}"
          echo "${IMAGE}@${DIGEST}" > "dist/kafkafim-${V}-image.digest"

      - name: Chart present?
        id: chart
        run: test -f charts/kafkafim/Chart.yaml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1   # helm-unittest 1.2.1 supports Helm >= 4.3; keep ci.yml and release.yml in step
      - if: steps.chart.outputs.exists == 'true'
        name: Package, push and sign chart
        env:
          V: ${{ steps.ver.outputs.version }}
          CHART_REPO: ${{ steps.ver.outputs.chart_repo }}
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm package charts/kafkafim --version "$V" --app-version "$V" -d dist
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/kafkafim-$V.tgz" "$CHART_REPO" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]*' push.log | head -1)
          cosign sign --yes --use-signing-config=false --new-bundle-format=false "${CHART_REPO#oci://}/kafkafim@${DIGEST}"

      - name: Air-gap bundle
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ -f docs/DELIVERY.md ]; then
            sed "s/1\.2\.3/$V/g" docs/DELIVERY.md > dist/IMPORT.md
          else
            echo "Import instructions: see docs/DELIVERY.md in the repository." > dist/IMPORT.md
          fi
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp dist/SHA256SUMS
          tar -czf "kafkafim-$V-airgap.tar.gz" -C dist .
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}   # v0.3.0-rc.1 must not become the "latest" release
          fail_on_unmatched_files: true   # the default only warns when a pattern below matches nothing
          files: |
            kafkafim-*-airgap.tar.gz
            dist/*.sbom.spdx.json
            dist/*.tgz
            dist/kafkafim-*-grafana/alerts/kafkafim-alerts.yaml
            dist/kafkafim-*-grafana/dashboards/*.json
