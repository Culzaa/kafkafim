name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's temporary gh-readonly-queue/... branch (main plus the queued pull requests).
  # The required checks must report on it, or the queue never merges the entry.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
# A newer push to a pull request cancels its older run. On main and in the merge queue every
# commit gets its own complete run (docs/DELIVERY.md): a per-commit group, never cancelled. A
# queue entry's github.ref is a unique gh-readonly-queue/... branch, but a shared group could
# still replace a pending run, so it is keyed on the commit SHA like main. With one group for
# main, a run still in progress would survive (cancel-in-progress false) but a pending one
# would still be replaced by the next merge, leaving that commit without an image build.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides which gate jobs a pull request needs (docs/DELIVERY.md, "Docs-only pull requests").
  # Skipped jobs report success, so the check names stay usable as required checks; a
  # workflow-level paths-ignore would leave them pending instead. Fails open: if this job
  # fails, its outputs are empty and every job below runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      helm: ${{ steps.diff.outputs.helm }}
      grafana: ${{ steps.diff.outputs.grafana }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # the PR merge commit and its first parent, the base branch tip
      - id: diff
        name: Classify changed paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            # Pushes to main and merge queue runs (merge_group) run everything. No checkout
            # happened, so this decision is not in ci/changes.sh.
            printf 'docs_only=false\nhelm=true\ngrafana=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          ci/changes.sh

  build:
    name: Build and test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      # Integration tests run in the parallel `integration` job, so `image` can start sooner.
      - name: Style, unit and architecture tests
        run: ci/build.sh
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Unit test coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-unit
          path: target/jacoco.exec
          if-no-files-found: ignore
      - name: Application jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

  # Failsafe only (*IntegrationTest, Testcontainers), in parallel with `build`. `build` already
  # runs Spotless, Checkstyle and Surefire on the same commit, so they are skipped here.
  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Starts pulling every Testcontainers image named in src/test while Java is set up and
      # Maven compiles. No wait: a container start that needs an image still being pulled joins
      # the daemon's in-flight pull. A failed pull only warns; Testcontainers pulls again.
      # Testcontainers' own ryuk image (2 MB) is not named in src/test and is left to it.
      - name: Pre-pull Testcontainers images
        shell: bash
        run: ci/prepull-images.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Integration tests
        run: ci/integration-tests.sh
      # Failsafe exits 0 when its **/*IntegrationTest.java include matches nothing, so a discovery
      # break (rename, pom edit, a swallowed fork crash) would turn this required check green with
      # nothing run: the script fails unless every *IntegrationTest source file produced a report.
      - name: Check every integration test class ran
        shell: bash
        run: ci/check-integration-ran.sh
      - name: Image pre-pull results
        if: always()
        shell: bash
        run: ci/prepull-results.sh
      - name: Integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
      - name: Integration test coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-integration
          path: target/jacoco-it.exec
          if-no-files-found: ignore

  # Merges the unit and integration coverage data, publishes the report and enforces the floor
  # from pom.xml. Not a required check (docs/DELIVERY.md, "Coverage floor").
  coverage:
    name: Coverage
    needs: [build, integration]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacoco-*
          path: coverage-data
          merge-multiple: true
      - name: Merge, report and check the floor
        run: ci/coverage.sh coverage-data
      - name: Coverage summary
        if: always()
        run: ci/coverage-summary.sh
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # PIT on the pure-logic route and decode packages, with the floor from pom.xml. Not a required
  # check (docs/DELIVERY.md, "Mutation testing").
  mutation:
    name: Mutation tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Mutation analysis
        run: ci/mutation.sh
      - name: Mutation summary
        if: always()
        run: ci/mutation-summary.sh
      - name: Mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: target/pit-reports/
          if-no-files-found: ignore

  # Needs only `build` (the jar), so it runs while `integration` is still running. Both are
  # required checks (docs/DELIVERY.md), so a pull request cannot merge with either failing.
  image:
    name: Container image
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: target/
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: kafkafim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the image
        run: ci/image-smoke.sh kafkafim:ci

  # Also checks the Grafana dashboards and Prometheus alert rules under deploy/grafana/, so the
  # set of required checks stays the same. Each half runs only when its paths changed.
  helm:
    name: Helm chart
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.helm != 'false' || needs.changes.outputs.grafana != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chart present and changed?
        id: chart
        env:
          HELM_CHANGED: ${{ needs.changes.outputs.helm }}
        run: |
          if [ "$HELM_CHANGED" != false ] && [ -f charts/kafkafim/Chart.yaml ]; then exists=true; else exists=false; fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1   # helm-unittest 1.2.1 supports Helm >= 4.3; keep ci.yml and release.yml in step
      - if: steps.chart.outputs.exists == 'true'
        run: ci/chart-lint.sh
      # helm-unittest does not enforce Chart.yaml kubeVersion, so assert it with helm itself.
      - if: steps.chart.outputs.exists == 'true'
        name: Chart refuses Kubernetes older than 1.27
        shell: bash
        run: ci/chart-kubeversion.sh
      # Third-party chart tools are pinned and cached so an outage of github.com release
      # downloads or of the Go module proxy cannot fail the gate once the cache is warm.
      # The key changes with every pin below; a cache is only saved by a passing job.
      - if: steps.chart.outputs.exists == 'true'
        name: Restore chart tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chart-tools
          key: chart-tools-${{ runner.os }}-${{ runner.arch }}-kubeconform-v0.8.0-helm-unittest-1.2.1-bbcebd42
      - if: steps.chart.outputs.exists == 'true'
        name: Template and validate against Kubernetes schemas
        shell: bash
        env:
          TOOLS: ${{ runner.temp }}/chart-tools
        run: |
          # go install verifies the module against sum.golang.org; the cached binary skips the proxy.
          [ -x "$TOOLS/bin/kubeconform" ] || GOBIN="$TOOLS/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          PATH="$TOOLS/bin:$PATH" ci/chart-validate.sh
      # The local demo's umbrella chart (deploy/local/kafkafim-demo): charts/kafkafim as a
      # subchart plus Kafka, Elasticsearch and Grafana LGTM. Its symlinks into charts/ and
      # deploy/grafana must resolve in a plain checkout; the template fails without the dashboards.
      - if: steps.chart.outputs.exists == 'true'
        name: Demo chart lint, template and validate
        shell: bash
        env:
          TOOLS: ${{ runner.temp }}/chart-tools
        run: PATH="$TOOLS/bin:$PATH" ci/chart-demo.sh
      - if: steps.chart.outputs.exists == 'true'
        name: Chart unit tests
        shell: bash
        env:
          ASSET_TOKEN: ${{ github.token }}   # unset after the downloads, before any plugin code runs
          TOOLS: ${{ runner.temp }}/chart-tools
          # helm-unittest 1.2.1: the signed all-platform plugin tarball, its provenance file
          # (release asset ids are immutable), their SHA-256 and the release key's fingerprint.
          # The key is .github/keys/helm-unittest-public-key.asc, copied from the v1.2.1 tag; it
          # expires 2028-05-06, so re-copy it from upstream before then. A version bump changes
          # the asset ids, both SHA-256s and the cache key above.
          TGZ: unittest-1.2.1.tgz
          TGZ_ASSET: '607406094'
          TGZ_SHA256: bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f
          PROV_ASSET: '607406098'
          PROV_SHA256: 23833d293bd575b552312e17e0c1900199857a327b44d7a1b6a25811b1514bbd
          KEY_FPR: 853008CD0B0A5A2DA04FF8A5616AD47F65B54AC7
        run: |
          d="$TOOLS/helm-unittest"
          mkdir -p "$d"
          # github.com/.../releases/download/ has returned 504 for hours while the API
          # asset endpoint kept serving, so fetch through the API with the job token.
          fetch() {
            [ -s "$d/$1" ] && return 0
            for i in 1 2 3 4 5; do
              if GH_TOKEN="$ASSET_TOKEN" gh api -H 'Accept: application/octet-stream' "repos/helm-unittest/helm-unittest/releases/assets/$2" > "$d/$1.part"; then
                mv "$d/$1.part" "$d/$1"; return 0
              fi
              echo "download of $1 failed (attempt $i)" >&2; [ "$i" -lt 5 ] && sleep $((i * 10))
            done
            return 1
          }
          fetch "$TGZ" "$TGZ_ASSET"
          fetch "$TGZ.prov" "$PROV_ASSET"
          unset ASSET_TOKEN
          printf '%s  %s\n' "$TGZ_SHA256" "$d/$TGZ" "$PROV_SHA256" "$d/$TGZ.prov" | sha256sum -c -
          ci/helm-unittest-keyring.sh .github/keys/helm-unittest-public-key.asc "$KEY_FPR" "$RUNNER_TEMP/helm-unittest.gpg"
          # Helm 4 checks the tarball against the signed .prov next to it.
          ci/chart-unittest.sh "$d/$TGZ" "$RUNNER_TEMP/helm-unittest.gpg"
      # Same pinning as the chart tools: the Prometheus release tarball (promtool) is fetched
      # through the GitHub API asset endpoint, checked against a pinned SHA-256 on every run,
      # and cached under a key that changes with the pin.
      - if: needs.changes.outputs.grafana != 'false'
        name: Restore Grafana tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grafana-tools
          key: grafana-tools-${{ runner.os }}-${{ runner.arch }}-prometheus-3.15.1-6a726885
      - if: needs.changes.outputs.grafana != 'false'
        name: Dashboards and alert rules
        shell: bash
        env:
          ASSET_TOKEN: ${{ github.token }}
          TOOLS: ${{ runner.temp }}/grafana-tools
          # Prometheus 3.15.1, linux-amd64; the SHA-256 matches the release's sha256sums.txt.
          # A version bump changes the asset id, the SHA-256 and the cache key above.
          TGZ: prometheus-3.15.1.linux-amd64.tar.gz
          TGZ_ASSET: '662697731'
          TGZ_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          mkdir -p "$TOOLS"
          if [ ! -s "$TOOLS/$TGZ" ]; then
            for i in 1 2 3 4 5; do
              if GH_TOKEN="$ASSET_TOKEN" gh api -H 'Accept: application/octet-stream' "repos/prometheus/prometheus/releases/assets/$TGZ_ASSET" > "$TOOLS/$TGZ.part"; then
                mv "$TOOLS/$TGZ.part" "$TOOLS/$TGZ"; break
              fi
              echo "download of $TGZ failed (attempt $i)" >&2
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep $((i * 10))
            done
          fi
          unset ASSET_TOKEN
          printf '%s  %s\n' "$TGZ_SHA256" "$TOOLS/$TGZ" | sha256sum -c -
          tar -xzf "$TOOLS/$TGZ" -C "$RUNNER_TEMP" --strip-components=1 "${TGZ%.tar.gz}/promtool"
          PATH="$RUNNER_TEMP:$PATH" ci/grafana-alerts.sh

  # --- Shell style (ADR-0046; Google Shell Style Guide): shellcheck + shfmt on every tracked *.sh.
  # Self-contained: no `needs`, runs on every change (a few seconds). Both tools are pinned and
  # checked against a SHA-256, so a changed release asset fails the job instead of running.
  shell:
    name: Shell style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and shfmt
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/shell-tools"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $bin/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$bin/shellcheck.tar.xz" -C "$bin" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o "$bin/shfmt" "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $bin/shfmt" | sha256sum -c -
          chmod +x "$bin/shfmt"
          echo "$bin" >> "$GITHUB_PATH"
      - name: shellcheck and shfmt
        shell: bash
        run: ci/shell-style.sh
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/shell-tools"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
      - name: actionlint (shellcheck on inline run blocks)
        # Inline `run:` shell is YAML to the *.sh checks above; actionlint runs the shellcheck
        # installed above on every workflow `run:` block (#278).
        run: '"$RUNNER_TEMP/shell-tools/actionlint" -color'

  # --- Markdown style (ADR-0046, #266; Google Markdown Style Guide): markdownlint-cli2 on every
  # *.md. Rules and their exceptions are in .markdownlint-cli2.jsonc. Self-contained: no `needs`,
  # runs on every change. The action is pinned to a release; v25.0.0 bundles markdownlint-cli2
  # 0.24.0, the version CONTRIBUTING gives for local runs.
  markdown:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  # ---- Grafana files format (#268) ----
  # Dashboards must be canonical JSON (the YAML is checked by "YAML format"). Not a required check;
  # runs only when deploy/grafana or this workflow changed. The step names below are the
  # job's whole interface, so it merges cleanly beside other format jobs.
  grafana-format:
    name: Grafana format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.grafana != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dashboards are canonical JSON
        shell: bash
        # Google JSON Style Guide where Grafana's schema allows (see ci/grafana-format.sh).
        run: ci/grafana-format.sh

  # --- YAML format and XML whitespace (#280, #281; ADR-0046): Google has no YAML guide, so .yamllint.yaml is the standard.
  # Self-contained like "Shell style". charts/*/templates are Helm templates, not YAML.
  yaml:
    name: YAML format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --disable-pip-version-check yamllint==1.37.1
          ci/yaml-lint.sh
      - name: Container image versions agree
        # Dependabot's docker-compose entries bump the two compose files; the demo chart's values
        # and the Testcontainers constants name the same images and are bumped by hand (#386).
        # Each image must have one tag everywhere, so a half-done bump fails here.
        run: ci/image-versions-agree.sh
      - name: Air-gap development bundle inputs agree with the repository
        # docs/DELIVERY.md, "Air-gap development bundle" (ADR-0056): every image the repository
        # names and every Maven goal a workflow or ci/ script runs must be one the bundle script takes.
        run: tools/airgap-dev-bundle.sh check
      - name: CI definitions agree
        # ci.yml and .gitlab-ci.yml call the same ci/ scripts (docs/DELIVERY.md, "CI on GitLab").
        run: ci/check-parity.sh
      - name: XML has no tabs
        # .editorconfig: XML indents with 2 spaces; pom.xml is the one declared tab exception (#280).
        run: ci/xml-tabs.sh
