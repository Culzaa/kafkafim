version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ['org.springframework*'] }
      all-others: { patterns: ['*'] }
    ignore:
      # Must equal the version micrometer-registry-otlp depends on; the pom's enforcer
      # rule fails otherwise, which would block the whole all-others group. Bump it by
      # hand in the Boot/Micrometer upgrade that trips the rule.
      - dependency-name: 'io.opentelemetry.proto:opentelemetry-proto'
      # Built against one OpenTelemetry SDK version; must move with the SDK the Spring
      # Boot BOM manages, not ahead of it (pom.xml, ADR-0044).
      - dependency-name: 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'
      - dependency-name: 'io.opentelemetry.instrumentation:opentelemetry-kafka-clients-2.6'
      - dependency-name: 'io.opentelemetry.instrumentation:opentelemetry-kafka-clients-common-0.11'
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # compose.yaml and loadtest/compose.yaml. One group, so the Kafka, Elasticsearch and LGTM
  # bumps arrive together; the demo chart's values.yaml and the Testcontainers constants in
  # src/test name the same images and are bumped by hand in that PR (CI job "YAML format" fails
  # until all four places agree).
  - package-ecosystem: docker-compose
    directories: [/, /loadtest]
    schedule: { interval: weekly }
    groups:
      local-stack-images: { patterns: ['*'] }
