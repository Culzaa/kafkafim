apiVersion: v2
name: kafkafim
description: Kafka to Elasticsearch ingest for Kubernetes. One release per Kubernetes cluster; one Deployment per group.
type: application
# Both are set from the git tag at release time (helm package --version --app-version).
version: 0.0.0-dev
appVersion: 0.0.0-dev
# topologySpreadConstraints[].matchLabelKeys (rendered by default) needs Kubernetes 1.27 (beta,
# on by default). The -0 suffix lets managed-cluster versions such as 1.27.3-gke.100 match.
kubeVersion: ">=1.27.0-0"
home: https://github.com/matabar/kafkafim
sources:
  - https://github.com/matabar/kafkafim
keywords:
  - kafka
  - elasticsearch
  - ingest
