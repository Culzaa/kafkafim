# kafkafim chart values. One release per Kubernetes cluster; see docs/HELM.md.
# The per-cluster values files (real clusters, topics, Secret names) live in the
# team's infrastructure repository, not here.

nameOverride: ""
fullnameOverride: ""

image:
  # Overridden to the internal registry in the air gap:
  #   --set image.registry=registry.internal/kafkafim
  registry: ghcr.io/matabar
  repository: kafkafim
  # Defaults to .Chart.AppVersion (set from the git tag at release time). A tag only,
  # never "<tag>@sha256:...": the digest goes in image.digest.
  tag: ""
  # Pins the exact signed image, e.g. sha256:<64 hex> from the release bundle's
  # kafkafim-<ver>-image.digest (the part after "@"). When set, the image is
  # <registry>/<repository>@<digest>, or <registry>/<repository>:<tag>@<digest> if
  # image.tag is also set; the runtime pulls by digest either way. The
  # app.kubernetes.io/version label still comes from image.tag or appVersion.
  digest: ""
  pullPolicy: IfNotPresent
  # Names of existing image pull Secrets, e.g. [{name: internal-registry}].
  pullSecrets: []

# Rendered into each group's application-kafkafim.yaml. Only these three keys are
# accepted (values.schema.json rejects any other key under config.kafkafim, such as
# allow-inline-secrets, which is for local development only: the application refuses
# allow-inline-secrets=true on Kubernetes however it is set (e.g. through extraEnv), so
# secrets always come from secrets[] below).
# Every group's ConfigMap gets kafka + elasticsearch verbatim plus only its own
# pipelines.
# A route with drop: true discards the documents it selects, instead of a cluster and an
# index (DESIGN §5.3, ADR-0037); they are counted as kafkafim_docs_total{outcome="dropped"}:
#   pipelines:
#     app-logs:
#       source: { cluster: prod-a, topics: [app.logs], concurrency: 4 }   # concurrency is optional:
#                                    # consumers per pod, >= 1; unset = the pod's CPU count; capped at the partitions
#       routes:
#         - name: debug
#           when: [ { field: /level, equals: debug } ]
#           drop: true                 # no cluster, identity, index, pipeline or transform
#         - default: true
#           cluster: search-eu
#           index: "logs-%{+yyyy.MM.dd}"
# A route's transform lists steps (remove, rename, set) applied in order to that route's own
# copy of the document, after routing and _id extraction (DESIGN §8, ADR-0047). set takes
# exactly one of value (a JSON string) or json (the text of one JSON value):
#         - name: eu
#           cluster: search-eu
#           index: "orders-eu-%{+yyyy.MM}"
#           transform:
#             - { op: remove, field: /card/number }
#             - { op: rename, field: /usr, to: /user }
#             - { op: set, field: /event/dataset, value: orders }
#             - { op: set, field: /event/version, json: "2" }
config:
  kafkafim:
    kafka:
      clusters: {}
    elasticsearch:
      clusters: {}
    pipelines: {}

# Existing Secrets mounted read-only for Spring's configtree import. mountPath must
# be below /etc/kafkafim/secrets/ and unique; the path relative to that root becomes
# the property name, e.g. /etc/kafkafim/secrets/kafka/prod-a.orders-reader/password
# -> ${kafka.prod-a.orders-reader.password}. Every group mounts every entry.
#   - name: kafka-prod-a-orders-reader
#     mountPath: /etc/kafkafim/secrets/kafka/prod-a.orders-reader
secrets: []

# One Deployment + ConfigMap + PodDisruptionBudget + Service (+ HPA) per group.
# Group names are DNS labels; resources are named <fullname>-<group>.
#   orders:
#     pipelines: [orders]            # required, each pipeline in exactly one group
#     replicas: 6                    # default 2; < 2 needs allowSingleReplica: true
#     allowSingleReplica: false
#     resources: {}                  # default: top-level resources
#     autoscaling:                   # CPU HPA; replicas is then omitted from the Deployment
#       enabled: false
#       minReplicas: 2
#       maxReplicas: 12              # keep <= partition count
#       targetCPUUtilizationPercentage: 70
#     pdb: {}                        # default: top-level pdb (maxUnavailable: 1 if single-replica)
#     nodeSelector: {}               # default: top-level nodeSelector
#     tolerations: []                # default: top-level tolerations
#     affinity: {}                   # default: top-level affinity, else preferred hostname anti-affinity
#     podAnnotations: {}             # merged over top-level podAnnotations
groups: {}

# Defaults for every group (a group's own value replaces these, it is not merged; an
# empty group value such as tolerations: [] replaces too, and an absent one inherits).
# Memory sizing (docs/HELM.md "Sizing memory"; measured in docs/LOADTEST.md):
#   heap       >= about 3 x the sum of max-in-flight-bytes over the group's pipelines
#   limit      >= heap / 0.75 (MaxRAMPercentage) + 250 to 300 MiB headroom (metaspace,
#                 threads, direct buffers), which an OOMKill, not an OutOfMemoryError, enforces
# 1536Mi gives a heap of about 1.1 GiB: enough for four pipelines at the default 64 MB
# (3 x 256 MB = 768 MB). 1Gi did not fit them: peak RSS was 1,045 MiB. Set a larger
# group resources block for more pipelines, larger documents or a higher max-in-flight-bytes.
resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 1536Mi
# Opt-in size limit of the /tmp emptyDir (a Kubernetes quantity such as 256Mi); unset means
# unbounded. Exceeding it evicts the pod instead of filling the node's ephemeral storage.
# An ephemeral-storage request needs no value of its own: add it to resources, e.g.
#   resources: { requests: { ephemeral-storage: 256Mi } }
tmpSizeLimit: ""
nodeSelector: {}
tolerations: []
# Empty means: preferred pod anti-affinity on kubernetes.io/hostname within the group.
affinity: {}

otel:
  # OTLP/HTTP endpoint (Elastic APM Server today; a Collector later is just a new URL).
  # Metrics, traces and logs all go there; stdout keeps the logs for `kubectl logs`.
  endpoint: http://apm-server.observability:8200
  # Non-secret headers (header name -> value), rendered as OTEL_EXPORTER_OTLP_HEADERS
  # (k=v,k2=v2, with "%" and "," percent-encoded). Spring Boot applies them to the
  # OTLP metrics, trace and log exporters.
  #   x-tenant: kafkafim
  headers: {}
  # Secret headers (header name -> key of an existing Secret), e.g. the APM Server
  # secret token. The Secret value is the whole header value ("Bearer <token>" or
  # "ApiKey <base64 id:key>"). The chart renders only the Secret name and key: a
  # projected volume puts each value in a file named after the header, mounted under
  # the configtree root where it binds to the three exporters' headers
  # (/etc/kafkafim/secrets/management/..., which secrets[] must not use). Read at
  # startup: restart the pods after rotating the Secret.
  #   Authorization:
  #     secretName: apm-server-token
  #     key: authorization
  secretHeaders: {}

jvm:
  options: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

# Additional container env vars and envFrom sources (secret OTLP headers belong in
# otel.secretHeaders, not here). extraEnv must not redefine the variables the chart
# sets (SPRING_PROFILES_ACTIVE, SPRING_CONFIG_ADDITIONAL_LOCATION, SPRING_CONFIG_IMPORT,
# OTEL_EXPORTER_OTLP_ENDPOINT, JAVA_TOOL_OPTIONS, and OTEL_EXPORTER_OTLP_HEADERS plus its
# _METRICS_/_TRACES_/_LOGS_ variants when otel.headers or otel.secretHeaders is set).
extraEnv: []
extraEnvFrom: []

# Extra Kubernetes objects deployed with the release (for example an ExternalSecret that
# creates a Secret listed under `secrets`). Each entry is a string, rendered through `tpl`
# so it can use release values, or a map rendered as YAML. The objects are not validated
# by values.schema.json.
extraObjects: []

serviceAccount:
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Must exceed the application's spring.lifecycle.timeout-per-shutdown-phase (60s).
terminationGracePeriodSeconds: 90

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 2
    failureThreshold: 30
    timeoutSeconds: 2
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 2

# PodDisruptionBudget per group. maxUnavailable, when set, wins over minAvailable (so
# --set pdb.maxUnavailable=1 needs no null for the default). A single-replica group
# (allowSingleReplica with replicas, or autoscaling.minReplicas, below 2) that sets no
# pdb of its own gets maxUnavailable: 1 instead of this default, because minAvailable 1
# on one pod would block every node drain.
pdb:
  minAvailable: 1

topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# Ingress-only NetworkPolicy for every kafkafim pod of this release: allows TCP 8080
# (actuator, /actuator/reload) from the listed peers only. Egress
# is not restricted; a cluster that default-denies egress writes its own policy (see
# "Egress the pods need" in docs/HELM.md). The default allows pods in the release's
# namespace; add another namespace
# if something outside it calls the actuator. An empty
# list means any source (Kubernetes semantics for an ingress rule without `from`).
networkPolicy:
  enabled: false
  allowFrom:
    - podSelector: {}

# Extra pod labels; must not use the selector keys app.kubernetes.io/{name,instance,component}.
podLabels: {}
podAnnotations: {}
