suite: extraObjects
release:
  name: kafkafim
  namespace: ingest
templates:
  - templates/extra-objects.yaml
tests:
  - it: renders nothing by default
    values:
      - ../ci/minimal-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders map and string entries as separate documents
    values:
      - ../ci/minimal-values.yaml
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: from-map
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ .Release.Name }}-from-string
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: from-map
        documentIndex: 0
      - equal:
          path: metadata.name
          value: kafkafim-from-string
        documentIndex: 1

  - it: rejects an entry that is neither a string nor a map
    values:
      - ../ci/minimal-values.yaml
    set:
      extraObjects: [5]
    asserts:
      - failedTemplate: {}
