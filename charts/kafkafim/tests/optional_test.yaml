suite: opt-in NetworkPolicy
release:
  name: kafkafim
  namespace: ingest
tests:
  - it: renders no NetworkPolicy by default
    values:
      - ../ci/minimal-values.yaml
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ingress-only NetworkPolicy for all groups when enabled
    template: templates/networkpolicy.yaml
    values:
      - ../ci/network-policy-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: kafkafim
            app.kubernetes.io/instance: kafkafim
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - ports:
                - { port: 8080, protocol: TCP }
              from:
                - podSelector: {}
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring

  - it: an empty allowFrom renders an ingress rule without from (any source)
    values:
      - ../ci/minimal-values.yaml
    template: templates/networkpolicy.yaml
    set:
      networkPolicy:
        enabled: true
        allowFrom: []
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: 8080
                  protocol: TCP
